[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qmas_task_allocation"
version = "0.0.1"
authors = [
  { name="Anthony Goeckner" },
  { name="Aria Ruan" },
]
description = "QMAS task allocation project."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.setuptools]
packages = [
    "flocking_zoo",
    "flocking_zoo.env",
    "patrolling_zoo",
    "patrolling_zoo.env",
    "test",
    "onpolicy",
    "onpolicy.algorithms",
    "onpolicy.algorithms.r_mappo",
    "onpolicy.algorithms.r_mappo.algorithm",
    "onpolicy.algorithms.utils",
    "onpolicy.envs",
    "onpolicy.envs.flocking",
    "onpolicy.runner",
    "onpolicy.runner.separated",
    "onpolicy.runner.shared",
    "onpolicy.scripts",
    "onpolicy.scripts.render",
    "onpolicy.scripts.train",
    "onpolicy.utils",
    "diffuser"
]