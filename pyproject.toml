[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qmas_task_allocation"
version = "0.0.1"
authors = [
  { name="Anthony Goeckner" },
  { name="Aria Ruan" },
]
description = "QMAS task allocation project."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = [".", "flocking_zoo", "onpolicy", "patrolling_zoo", "comms_policy", "qmas", "test", "toy_problem", "isru_zoo", "hanabi_zoo"]
namespaces = false
